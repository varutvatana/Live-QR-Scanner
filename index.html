<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Live QR Scanner</title>
<!--
  Live QR Scanner  (v1.1) – one file, works for any web app.

  HOW AN APP USES IT
    Open:   <this page>?return=<URL-encoded link back to the app>
    Result: the page reads ANY QR code (live camera, or a photo from the gallery) and goes to
              <return link>&qr=<the QR text, URL-encoded>      ("?qr=" if the link has no "?")
            "Back" goes to the return link without qr=.
    The app itself decides whether the QR belongs to it – this page does no checking.

  SAFETY
    Only return links that match ALLOWED_RETURN below are accepted (so nobody can use this
    page to send scanned QR text to a strange site). Add a line there for each new app host.
    Nothing is stored and nothing is sent anywhere except to the return link.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap">
<style>
  :root { --accent: #5E8C7A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; background: rgba(0,0,0,.55); position: relative; z-index: 2; }
  .mark { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }
  .mark svg { width: 19px; height: 19px; }
  header strong { font-size: 17px; }
  .view { position: relative; flex: 1 1 auto; overflow: hidden; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame { position: absolute; left: 50%; top: 46%; width: min(68vw, 300px); aspect-ratio: 1; transform: translate(-50%, -50%);
           border-radius: 22px; box-shadow: 0 0 0 9999px rgba(0,0,0,.42); border: 3px solid rgba(255,255,255,.95); transition: border-color .15s; }
  .frame.found { border-color: #7BE0A9; }
  .msg { position: absolute; left: 16px; right: 16px; bottom: 18px; text-align: center; font-weight: 600; font-size: 16px; line-height: 1.4;
         text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .msg { white-space: pre-line; }
  .msg.bad { color: #FFC9C3; }
  footer { display: flex; align-items: center; gap: 10px;
           padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: rgba(0,0,0,.55); position: relative; z-index: 2; }
  .btn { flex: 1 1 0; min-width: 0; display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px;
         border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; font: inherit; font-weight: 600; font-size: 15px;
         text-decoration: none; cursor: pointer; white-space: nowrap; }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .icon-btn { flex: 0 0 auto; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(255,255,255,.35); background: rgba(255,255,255,.08);
              color: #fff; display: grid; place-items: center; cursor: pointer; padding: 0; }
  .icon-btn svg { width: 24px; height: 24px; }
  [hidden] { display: none !important; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 10px; }
  .center p { margin: 0; max-width: 340px; line-height: 1.5; color: #ddd; }
  canvas, input[type=file] { display: none; }
  /* camera permission guide */
  .guide { width: 100%; max-width: 360px; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 18px; padding: 18px; text-align: left; }
  .guide h2 { margin: 0 0 6px; font-size: 18px; }
  .guide p { margin: 0 0 10px; color: #ddd; line-height: 1.5; max-width: none; }
  .guide ol { margin: 0; padding-left: 22px; color: #ddd; line-height: 1.55; }
  .guide li { margin: 3px 0; }
  .guide b { color: #fff; }
  .guide .note { margin: 10px 0 0; font-size: 13px; color: #aaa; }
  .guide .btn { width: 100%; margin-top: 14px; flex: none; }
</style>
</head>
<body>
<header>
  <span class="mark" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="#fff"><path d="M3 3h7v7H3V3zm2 2v3h3V5H5zm9-2h7v7h-7V3zm2 2v3h3V5h-3zM3 14h7v7H3v-7zm2 2v3h3v-3H5zm9-2h2v2h-2v-2zm2 2h2v2h-2v-2zm2-2h3v2h-3v-2zm-4 4h2v3h-2v-3zm4 0h3v3h-2v-1h-1v-2z"/></svg>
  </span>
  <strong>Live QR Scanner</strong>
</header>

<div class="view" id="view">
  <video id="video" playsinline muted></video>
  <div class="frame" id="frame" hidden></div>
  <div class="center" id="center"><p id="center-msg">Starting the camera…</p><div class="guide" id="guide" hidden></div></div>
  <div class="msg" id="msg" hidden></div>
</div>

<footer>
  <button class="icon-btn" id="photo" type="button" aria-label="Upload a photo of a QR code" title="Upload photo">
    <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 16H5V5h14v14zm-5.04-6.71-2.75 3.54-1.96-2.36L6.5 17h11l-3.54-4.71z"/></svg>
  </button>
  <a class="btn" id="back" href="#">Back</a>
  <button class="btn" id="torch" type="button" hidden>Light</button>
  <button class="btn primary" id="retry" type="button" hidden>Try again</button>
</footer>
<!-- no "capture" attribute and a list of picture types → Android opens the photo gallery directly -->
<input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif">
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function () {
  'use strict';

  // ---- return links that are allowed (one line per app host) ----
  var ALLOWED_RETURN = [
    /^https:\/\/script\.google\.com\/(?:a\/macros\/[^\/?#]+|macros)\/s\/[A-Za-z0-9_-]+\/(?:exec|dev)(?:\?[^#]*)?$/   // Google Apps Script web apps
  ];

  var $ = function (id) { return document.getElementById(id); };
  var prm = new URLSearchParams(location.search);
  var ret = prm.get('return') || '';
  if (!ALLOWED_RETURN.some(function (re) { return re.test(ret); })) ret = '';
  $('back').href = ret || 'javascript:history.back()';

  var stream = null, raf = 0, busy = false, track = null, torchOn = false;
  var canFull = false;   // set below

  function center(text) {
    $('center').hidden = !text; $('center-msg').hidden = false; $('center-msg').textContent = text || ''; $('guide').hidden = true;
  }
  /** A card with steps instead of the plain message (html is fixed text from this file only). */
  function guide(html) {
    $('center').hidden = false; $('center-msg').hidden = true;
    var g = $('guide'); g.innerHTML = html; g.hidden = false;
    var b = g.querySelector('[data-go]'); if (b) b.addEventListener('click', function () { goFull(); openCamera(); });
    var r = g.querySelector('[data-reload]'); if (r) r.addEventListener('click', function () { location.reload(); });
  }
  function say(text, bad) { var m = $('msg'); m.hidden = !text; m.textContent = text || ''; m.classList.toggle('bad', !!bad); }

  /** Any QR text → back to the app, which decides what it means. */
  function deliver(text) {
    busy = true;
    $('frame').classList.add('found');
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) { /* ignore */ } }
    say('QR code read – going back…');
    stop();
    location.replace(ret + (ret.indexOf('?') === -1 ? '?' : '&') + 'qr=' + encodeURIComponent(text));
  }

  // ================= camera permission: 1) allowed → start  2) not decided → short tip, then ask  3) blocked → steps
  var ua = navigator.userAgent || '';
  var PHONE = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'ios'
            : /Android/.test(ua) ? 'android' : 'other';
  var TIP_KEY = 'lqs_tip_seen', permStatus = null, blocked = false;
  function tipSeen() { try { return localStorage.getItem(TIP_KEY) === '1'; } catch (e) { return false; } }
  function markTipSeen() { try { localStorage.setItem(TIP_KEY, '1'); } catch (e) { /* ignore */ } }

  /** 'granted' | 'prompt' | 'denied' | 'unknown' (browsers without the check). */
  function cameraPermission() {
    if (!navigator.permissions || !navigator.permissions.query) return Promise.resolve('unknown');
    return navigator.permissions.query({ name: 'camera' }).then(function (st) {
      if (!permStatus) {           // tell us when the person changes the setting → start by itself
        permStatus = st;
        try { st.onchange = function () { if (st.state !== 'denied' && blocked && !busy) { blocked = false; openCamera(); } }; } catch (e) { /* ignore */ }
      }
      return st.state;
    }).catch(function () { return 'unknown'; });
  }

  var TIP = {
    android: '<h2>Allow the camera</h2><p>Chrome will ask to use the camera. Tap <b>Allow while visiting the site</b> (not “Only this time”) so it doesn’t ask again.</p>',
    ios: '<h2>Allow the camera</h2><p>Safari will ask to use the camera. Tap <b>Allow</b>.</p>' +
         '<p class="note">So Safari stops asking every time: tap <b>aA</b> in the address bar → <b>Website Settings</b> → <b>Camera</b> → <b>Allow</b>.</p>',
    other: '<h2>Allow the camera</h2><p>Your browser will ask to use the camera. Choose <b>Allow</b> and, if offered, <b>Remember</b>.</p>'
  };
  var STEPS = {
    android: '<h2>Camera is blocked</h2><p>Turn it on once for this page:</p><ol>' +
      '<li>Tap the icon at the <b>left of the address bar</b>.</li><li>Tap <b>Permissions</b> (or <b>Site settings</b>).</li>' +
      '<li>Set <b>Camera</b> to <b>Allow</b>.</li></ol><p class="note">The camera starts by itself when you come back. If it doesn’t, tap Reload.</p>',
    ios: '<h2>Camera is blocked</h2><p>Turn it on once for this page:</p><ol>' +
      '<li>Tap <b>aA</b> at the left of the address bar.</li><li>Tap <b>Website Settings</b>.</li>' +
      '<li>Set <b>Camera</b> to <b>Allow</b>, then tap <b>Done</b>.</li><li>Tap <b>Reload</b> below.</li></ol>' +
      '<p class="note">For all websites: Settings app → Apps → Safari → Camera → Allow.</p>',
    other: '<h2>Camera is blocked</h2><p>Allow the camera for this page in your browser’s site settings (usually the icon at the left of the address bar), then tap Reload.</p>'
  };

  function start() {
    $('retry').hidden = true;
    if (!ret) { center('Please open the scanner from your app.'); $('photo').hidden = true; return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      center('This browser cannot use the camera here. Use the photo button, or open the link in Safari (iPhone) or Chrome (Android).'); return;
    }
    center('Starting the camera…');
    cameraPermission().then(function (state) {
      if (state === 'granted') return openCamera();                         // 1) already allowed
      if (state === 'denied') return showBlocked();                          // 3) blocked
      if (tipSeen()) return openCamera();                                    // 2) tip shown before → just ask
      guide(TIP[PHONE] + '<button class="btn primary" type="button" data-go>Start camera</button>');
    });
  }
  function showBlocked() {
    blocked = true; stop();
    guide(STEPS[PHONE] + '<button class="btn primary" type="button" data-reload>Reload</button>');
  }

  function openCamera() {
    $('retry').hidden = true;
    markTipSeen();
    if (!window.jsQR) { center('The QR reader could not be loaded. Please check the internet connection.'); $('retry').hidden = false; return; }
    center('Starting the camera…');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
      .then(function (s) {
        stream = s; track = s.getVideoTracks()[0];
        var v = $('video'); v.srcObject = s; v.setAttribute('playsinline', ''); v.muted = true;
        return v.play();
      })
      .then(function () {
        center(''); $('frame').hidden = false;
        say(canFull && !document.fullscreenElement ? 'Point the camera at a QR code.\nTap the screen for full screen.' : 'Point the camera at a QR code.');
        try {   // flashlight button where the phone supports it (mostly Android)
          var caps = track && track.getCapabilities ? track.getCapabilities() : {};
          $('torch').hidden = !caps.torch;
        } catch (e) { /* ignore */ }
        loop();
      })
      .catch(function (e) {
        stop();
        if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) return showBlocked();
        center('The camera could not be started (' + (e && e.name || 'error') + '). You can use the photo button instead.');
        $('retry').hidden = false;
      });
  }

  // ---- fast reading without freezing the picture
  // 1) the phone's own QR reader (BarcodeDetector – Android Chrome) when it has one,
  // 2) otherwise jsQR in a background worker, 3) otherwise jsQR here (slowest).
  // Reads about 8 times a second, never more than one read at a time, so the video stays smooth.
  var JSQR_URL = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
  var READ_EVERY_MS = 120, SIDE = 480;
  var engine = null, detector = null, worker = null, pending = false, timer = 0;

  function pickEngine() {
    if (engine) return Promise.resolve(engine);
    var tryNative = ('BarcodeDetector' in window) && window.BarcodeDetector.getSupportedFormats
      ? window.BarcodeDetector.getSupportedFormats().then(function (f) {
          if (f.indexOf('qr_code') === -1) return false;
          detector = new window.BarcodeDetector({ formats: ['qr_code'] }); return true;
        }).catch(function () { return false; })
      : Promise.resolve(false);
    return tryNative.then(function (ok) {
      if (ok) return (engine = 'native');
      try {
        var src = 'importScripts("' + JSQR_URL + '");onmessage=function(e){var d=e.data,r=null;' +
          'try{r=jsQR(new Uint8ClampedArray(d.b),d.w,d.h,{inversionAttempts:"dontInvert"})}catch(x){}postMessage(r&&r.data||"")}';
        worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
        worker.onmessage = function (e) { pending = false; if (e.data && !busy) deliver(e.data); };
        worker.onerror = function () { try { worker.terminate(); } catch (x) { /* ignore */ } worker = null; pending = false; engine = 'main'; };
        return (engine = 'worker');
      } catch (e) { return (engine = 'main'); }
    });
  }

  function loop() {
    var v = $('video'), c = $('canvas'), g = c.getContext('2d', { willReadFrequently: true });
    var tick = function () {
      if (!stream || busy) return;
      timer = setTimeout(tick, READ_EVERY_MS);
      if (pending || v.readyState < 2 || !v.videoWidth) return;
      if (engine === 'native') {
        pending = true;
        detector.detect(v).then(function (codes) {
          pending = false;
          if (codes && codes.length && codes[0].rawValue && !busy) deliver(codes[0].rawValue);
        }).catch(function () { pending = false; engine = worker ? 'worker' : 'main'; });
        return;
      }
      // the middle square (where the frame is) only – smaller and faster
      var s = Math.min(v.videoWidth, v.videoHeight), n = Math.min(SIDE, s);
      c.width = n; c.height = n;
      g.drawImage(v, (v.videoWidth - s) / 2, (v.videoHeight - s) / 2, s, s, 0, 0, n, n);
      var img = g.getImageData(0, 0, n, n);
      if (engine === 'worker' && worker) {
        pending = true;
        worker.postMessage({ b: img.data.buffer, w: n, h: n }, [img.data.buffer]);
      } else if (window.jsQR) {
        var code = window.jsQR(img.data, n, n, { inversionAttempts: 'dontInvert' });
        if (code && code.data) deliver(code.data);
      }
    };
    pickEngine().then(function () { clearTimeout(timer); tick(); });
  }

  function stop() {
    if (raf) cancelAnimationFrame(raf); raf = 0;
    clearTimeout(timer); timer = 0; pending = false;
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null; track = null;
  }

  // ---- photo from the gallery
  $('photo').addEventListener('click', function () { $('file').click(); });
  $('file').addEventListener('change', function (e) {
    var file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || busy) return;
    if (!window.jsQR) { say('The QR reader could not be loaded.', true); return; }
    say('Reading the photo…');
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      URL.revokeObjectURL(url);
      var c = $('canvas'), g = c.getContext('2d', { willReadFrequently: true });
      var sizes = [1000, 1600, 700], code = null;          // big photos read better when scaled down
      for (var i = 0; i < sizes.length && !code; i++) {
        var k = Math.min(1, sizes[i] / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * k)), h = Math.max(1, Math.round(img.height * k));
        c.width = w; c.height = h; g.drawImage(img, 0, 0, w, h);
        code = window.jsQR(g.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
      }
      if (code && code.data) deliver(code.data);
      else say('No QR code found in the photo. Try another photo, or scan with the camera.', true);
    };
    img.onerror = function () { URL.revokeObjectURL(url); say('This picture could not be opened.', true); };
    img.src = url;
  });

  // ---- full screen (hides the address bar) – Android Chrome; iPhone Safari does not allow it for web pages
  canFull = !!(document.documentElement.requestFullscreen) && window.matchMedia && matchMedia('(pointer: coarse)').matches;
  function goFull() {
    if (!canFull || document.fullscreenElement) return;
    document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(function () { /* ignore */ });
  }
  $('view').addEventListener('click', goFull);
  ['photo', 'torch', 'retry'].forEach(function (id) { $(id).addEventListener('click', goFull); });

  $('retry').addEventListener('click', openCamera);
  $('torch').addEventListener('click', function () {
    if (!track) return;
    torchOn = !torchOn;
    track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function () { torchOn = false; });
    $('torch').textContent = torchOn ? 'Light off' : 'Light';
  });
  // camera off while the page is hidden (phone locked, photo gallery open…), back on when shown again
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { stop(); return; }
    if (busy || stream || !ret) return;
    if (blocked) {                    // back from the settings → start if it is allowed now
      cameraPermission().then(function (st) { if (st === 'granted' && blocked) { blocked = false; openCamera(); } });
      return;
    }
    if ($('retry').hidden && $('guide').hidden) openCamera();
  });
  window.addEventListener('pagehide', stop);
  document.addEventListener('fullscreenchange', function () { if (document.fullscreenElement && stream && !busy) say('Point the camera at a QR code.'); });

  start();
})();
</script>
</body>
</html>
