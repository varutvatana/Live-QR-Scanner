<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Keryx Pilates – Scan QR</title>
<!--
  Keryx Pilates – live QR scanner (v3.2)
  Host this ONE file on any HTTPS site outside Google (e.g. GitHub Pages) and put its
  link in Code.gs → CFG.SCANNER_URL. The app opens it as:
      <scanner link>?app=<the app's /exec link>
  It reads the booking QR live from the rear camera and sends the trainer straight back
  to the app on that booking (?action=complete&t=<token>), where they tap Mark as Completed.
  Nothing is stored here and no data is sent anywhere except back to the app.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap">
<style>
  :root { --accent: #5E8C7A; --accent-dark: #4A7262; --ink: #2D2A26; --muted: #7A736A; --bg: #F5F1EB; --line: #E6DFD5; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #111; color: #fff; font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 10px; padding: calc(12px + env(safe-area-inset-top)) 16px 12px; background: rgba(0,0,0,.55); position: relative; z-index: 2; }
  .mark { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-family: Georgia, serif; font-weight: 600; font-size: 18px; }
  header strong { font-size: 17px; }
  .view { position: relative; flex: 1 1 auto; overflow: hidden; }
  video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame { position: absolute; left: 50%; top: 46%; width: min(68vw, 300px); aspect-ratio: 1; transform: translate(-50%, -50%);
           border-radius: 22px; box-shadow: 0 0 0 9999px rgba(0,0,0,.42); border: 3px solid rgba(255,255,255,.95); transition: border-color .15s; }
  .frame.found { border-color: #7BE0A9; }
  .msg { position: absolute; left: 16px; right: 16px; bottom: 18px; text-align: center; font-weight: 600; font-size: 16px; line-height: 1.4;
         text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  .msg.bad { color: #FFC9C3; }
  footer { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 10px;
           padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); background: rgba(0,0,0,.55); position: relative; z-index: 2; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 999px; border: 1px solid rgba(255,255,255,.35);
         background: transparent; color: #fff; font: inherit; font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer; }
  .btn.primary { background: var(--accent); border-color: var(--accent); }
  .btn[hidden] { display: none; }
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; gap: 10px; }
  .center p { margin: 0; max-width: 340px; line-height: 1.5; color: #ddd; }
  canvas { display: none; }
</style>
</head>
<body>
<header><span class="mark">K</span><strong>Scan booking QR</strong></header>

<div class="view">
  <video id="video" playsinline muted></video>
  <div class="frame" id="frame" hidden></div>
  <div class="center" id="center"><p id="center-msg">Starting the camera…</p></div>
  <div class="msg" id="msg" hidden></div>
</div>

<footer>
  <a class="btn" id="back" href="#">Back to app</a>
  <button class="btn" id="torch" type="button" hidden>Light</button>
  <button class="btn primary" id="retry" type="button" hidden>Try again</button>
</footer>
<canvas id="canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  // ---- where to go back to: only a Google Apps Script web app link is accepted
  var APP_RE = /^https:\/\/script\.google\.com\/(?:a\/macros\/[^\/?#]+|macros)\/s\/[A-Za-z0-9_-]+\/(?:exec|dev)$/;
  var app = new URLSearchParams(location.search).get('app') || '';
  if (!APP_RE.test(app)) app = '';
  $('back').href = app || 'javascript:history.back()';

  var stream = null, raf = 0, busy = false, track = null, torchOn = false;

  function center(text) { $('center').hidden = !text; $('center-msg').textContent = text || ''; }
  function say(text, bad) { var m = $('msg'); m.hidden = !text; m.textContent = text || ''; m.classList.toggle('bad', !!bad); }

  /** Booking token from a scanned QR (the app's link …?action=complete&t=<token>). */
  function tokenFrom(text) {
    text = String(text || '').trim();
    var m = text.match(/[?&]t=([A-Za-z0-9_-]{16,64})(?:&|#|$)/);
    if (m && /action=complete/.test(text)) return m[1];
    return '';
  }

  function start() {
    $('retry').hidden = true;
    if (!app) { center('Please open the scanner from the Keryx Pilates app (QR button → Camera).'); return; }
    if (!window.jsQR) { center('The QR reader could not be loaded. Please check the internet connection.'); $('retry').hidden = false; return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      center('This browser cannot use the camera here. Please open the link in Safari (iPhone) or Chrome (Android).'); return;
    }
    center('Starting the camera…');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false })
      .then(function (s) {
        stream = s; track = s.getVideoTracks()[0];
        var v = $('video'); v.srcObject = s; v.setAttribute('playsinline', ''); v.muted = true;
        return v.play();
      })
      .then(function () {
        center(''); $('frame').hidden = false;
        say('Point the camera at the booking QR code.');
        try {   // flashlight button where the phone supports it (mostly Android)
          var caps = track && track.getCapabilities ? track.getCapabilities() : {};
          $('torch').hidden = !caps.torch;
        } catch (e) { /* ignore */ }
        loop();
      })
      .catch(function (e) {
        stop();
        var denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
        center(denied ? 'Camera access was blocked. Please allow the camera for this page in your browser settings, then tap Try again.'
                      : 'The camera could not be started (' + (e && e.name || 'error') + ').');
        $('retry').hidden = false;
      });
  }

  function loop() {
    var v = $('video'), c = $('canvas'), g = c.getContext('2d', { willReadFrequently: true });
    var tick = function () {
      if (!stream) return;
      if (!busy && v.readyState >= 2 && v.videoWidth) {
        // read only the middle square (where the frame is) – faster and fewer wrong reads
        var s = Math.min(v.videoWidth, v.videoHeight), sx = (v.videoWidth - s) / 2, sy = (v.videoHeight - s) / 2, n = Math.min(640, s);
        c.width = n; c.height = n;
        g.drawImage(v, sx, sy, s, s, 0, 0, n, n);
        var code = window.jsQR(g.getImageData(0, 0, n, n).data, n, n, { inversionAttempts: 'dontInvert' });
        if (code && code.data) found(code.data);
      }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
  }

  var badTimer = 0;
  function found(text) {
    var tok = tokenFrom(text);
    if (!tok) {                       // some other QR code → keep scanning
      say('This is not a Keryx Pilates booking QR code.', true);
      clearTimeout(badTimer); badTimer = setTimeout(function () { say('Point the camera at the booking QR code.'); }, 1800);
      return;
    }
    busy = true;
    $('frame').classList.add('found');
    if (navigator.vibrate) { try { navigator.vibrate(60); } catch (e) { /* ignore */ } }
    say('QR code found – opening the booking…');
    stop();
    location.replace(app + '?action=complete&t=' + encodeURIComponent(tok));
  }

  function stop() {
    if (raf) cancelAnimationFrame(raf); raf = 0;
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null; track = null;
  }

  $('retry').addEventListener('click', start);
  $('torch').addEventListener('click', function () {
    if (!track) return;
    torchOn = !torchOn;
    track.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(function () { torchOn = false; });
    $('torch').textContent = torchOn ? 'Light off' : 'Light';
  });
  // camera off while the page is hidden (phone locked / other app), back on when shown again
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stop(); else if (!busy && !stream) start();
  });
  window.addEventListener('pagehide', stop);

  start();
})();
</script>
</body>
</html>
